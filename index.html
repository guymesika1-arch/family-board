<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>לוח המשפחה</title>
<meta name="description" content="לוח משימות ואירועים למשפחה">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="לוח המשפחה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Secular+One&display=swap">
<style>
/* Layout: one phone column — sticky date header + person filter, agenda cards whose time-block is painted in the child's color, fixed bottom tab bar. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#16202C; --muted:#5A6676; --line:#D6DCE4;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#DCE6FB;
  --warn:#B4410C; --warn-bg:#FDEBDD; --ok:#17803D; --ok-bg:#DCF3E3;
  --shadow:0 1px 2px rgba(22,32,44,.06),0 4px 14px rgba(22,32,44,.06);
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#19212B; --surface2:#141B23; --ink:#E7ECF2; --muted:#97A3B3; --line:#2A3542;
  --accent:#86A8FF; --accent-ink:#0D1526; --accent-soft:#22314F;
  --warn:#FB9A5B; --warn-bg:#3A2416; --ok:#5BD98A; --ok-bg:#16301F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#19212B; --surface2:#141B23; --ink:#E7ECF2; --muted:#97A3B3; --line:#2A3542;
  --accent:#86A8FF; --accent-ink:#0D1526; --accent-soft:#22314F;
  --warn:#FB9A5B; --warn-bg:#3A2416; --ok:#5BD98A; --ok-bg:#16301F;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}body{margin:0;overscroll-behavior-y:none}[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 150px}

/* header */
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px;margin-inline:-16px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.1;margin:0;flex:1;min-width:0;text-wrap:balance}
.top .fam{font-size:.82rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}
.people{display:flex;gap:8px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.people::-webkit-scrollbar{display:none}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem;white-space:nowrap}
.pchip .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.pchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pchip.kid[aria-pressed="true"]{background:var(--c);color:var(--ci);border-color:var(--c)}
.pchip.kid[aria-pressed="true"] .dot{background:var(--ci)}

/* sections */
.sec{margin-top:20px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.sec-h h2{font-family:var(--f-display);font-weight:400;font-size:1.15rem;margin:0}
.sec-h .count{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.sec-h .link{margin-inline-start:auto;background:none;border:0;color:var(--accent);font-weight:700;padding:6px 0}
.list{display:flex;flex-direction:column;gap:8px}
.empty{background:var(--surface2);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);font-size:.95rem}

/* task card */
.item{display:flex;align-items:stretch;background:color-mix(in srgb,var(--c,transparent) 9%,var(--surface));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-height:64px;cursor:pointer}
.item .when{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--wb,var(--surface2));color:var(--wi,var(--ink));padding:8px 4px;text-align:center}
.item .when .t{font-family:var(--f-num);font-weight:600;font-size:1rem;letter-spacing:-.02em}
.item .when .s{font-size:.72rem;font-weight:700;opacity:.85}
.item .body{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.item .title{font-weight:800;font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere}
.item .meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.item .tags{display:flex;flex-wrap:wrap;gap:4px}
.item .check{flex:none;width:52px;border:0;border-inline-start:1px solid var(--line);background:transparent;display:grid;place-items:center}
.item .check span{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center}
.item.done{opacity:.55}
.item.done .title{text-decoration:line-through}
.item.done .check span{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.kchip{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border-radius:999px;font-size:.78rem;font-weight:800;background:var(--c);color:var(--ci)}
.ptag{display:inline-flex;align-items:center;gap:4px;height:22px;padding-inline:7px;border-radius:6px;font-size:.76rem;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.ptag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill{display:inline-flex;align-items:center;height:22px;padding-inline:8px;border-radius:6px;font-size:.75rem;font-weight:800}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.soft{background:var(--accent-soft);color:var(--accent)}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start}
.stat b{display:block;font-family:var(--f-num);font-size:1.3rem;font-weight:600;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted);font-weight:700}
button.stat{cursor:pointer}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.92rem}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.report-btn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;background:var(--ink);color:var(--bg);border:0;border-radius:var(--r);padding:12px 14px;text-align:start}
.report-btn svg{width:26px;height:26px;flex:none}
.report-btn b{display:block;font-size:1rem}
.report-btn span{font-size:.82rem;opacity:.75}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px;margin-top:8px}
.cal-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:1.2rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.grid .dn{text-align:center;font-size:.75rem;color:var(--muted);font-weight:800;padding-block:4px}
.day{aspect-ratio:1/1.05;max-width:100%;border:1px solid transparent;background:var(--surface);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:4px;font-family:var(--f-num);font-size:.88rem;font-weight:600}
.day.out{opacity:.35}
.day.today{border-color:var(--accent);color:var(--accent)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:34px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}

/* shopping & contacts */
.add-row{display:flex;gap:8px;margin-top:10px}
.add-row input{flex:1;min-width:0}
.field,.add-row input,.add-row select{height:46px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding-inline:12px;font-size:16px;width:100%}
.add-row select{width:auto;flex:none}
.btn{height:46px;padding-inline:16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.block{width:100%}
.shop{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:50px;cursor:pointer}
.shop .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.shop.done{opacity:.5}
.shop.done .name{text-decoration:line-through}
.shop.done .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.shop .name{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.shop .x{border:0;background:none;color:var(--muted);width:36px;height:36px;font-size:1.2rem}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.contact .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.contact .nm{font-weight:800;font-size:1.05rem;flex:1;min-width:0}
.contact .ph{font-family:var(--f-num);font-size:.95rem;user-select:all;direction:ltr}
.contact .acts{display:flex;gap:6px;flex-wrap:wrap}
.contact .acts .btn{height:38px;padding-inline:12px;font-size:.9rem}
.contact .note{font-size:.88rem;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;bottom:0;inset-inline:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:800;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav .badge{position:absolute;top:8px;inset-inline-end:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--warn);color:#fff;font-size:.68rem;display:grid;place-items:center;padding-inline:4px;font-family:var(--f-num)}
.fab{position:fixed;z-index:9;inset-inline-end:max(16px,calc(50% - 304px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(29,78,216,.35)}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:1.3rem;margin:0 0 12px;text-wrap:balance}
.form{display:flex;flex-direction:column;gap:14px}
.lbl{font-size:.8rem;font-weight:800;color:var(--muted);letter-spacing:.03em;margin-bottom:6px;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
textarea.field{height:auto;min-height:70px;padding-block:10px;resize:vertical}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{position:relative}
.pick input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.pick span{display:inline-flex;align-items:center;gap:6px;height:38px;padding-inline:12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.92rem}
.pick span i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.pick input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pick.kid input:checked+span{background:var(--c);color:var(--ci);border-color:var(--c)}
.pick.kid input:checked+span i{background:var(--ci)}
.pick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.pick.sw span{width:38px;padding:0;justify-content:center;background:var(--c);border-color:transparent}
.pick.sw input:checked+span{outline:3px solid var(--ink);outline-offset:2px;background:var(--c)}
.templates{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.templates button{flex:none;height:34px;padding-inline:12px;border-radius:999px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.85rem}
.inline{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.inline input{width:20px;height:20px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}
.detail-row{display:flex;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);font-size:.95rem}
.detail-row b{width:84px;flex:none;color:var(--muted);font-size:.82rem;padding-top:2px}
.detail-row div{flex:1;min-width:0;overflow-wrap:anywhere}
.report{white-space:pre-wrap;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--f-body);font-size:.95rem;line-height:1.55;margin:0;user-select:text}
.mem{display:flex;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.mem .sw{width:28px;height:28px;border-radius:50%;background:var(--c);flex:none}
.mem .n{flex:1;min-width:0;font-weight:800}
.mem .n small{display:block;font-weight:600;color:var(--muted)}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:12px;font-weight:800}
.confirm .btn{height:38px}
.hint{font-size:.85rem;color:var(--muted)}
.set-sec{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.set-sec h4{font-family:var(--f-display);font-weight:400;font-size:1.1rem;margin:0}
.set-sec .hint{margin:0}
.sync-bar{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:8px 12px 8px 8px;font-weight:700;font-size:.92rem}
.sync-bar span{flex:1;min-width:0}
.code-box{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px dashed var(--accent);border-radius:12px;padding:8px 8px 8px 14px}
.code{font-family:var(--f-num);font-size:1.5rem;font-weight:600;letter-spacing:.14em;flex:1;color:var(--ink);user-select:all}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:12px}
#qrEl{background:#fff;padding:12px;border-radius:12px}
#qrEl img,#qrEl canvas{display:block}
.sync-bar .btn{height:38px;font-size:.88rem}

.fab2{position:fixed;z-index:9;inset-inline-end:max(20px,calc(50% - 300px));bottom:calc(146px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.fab2 svg{width:24px;height:24px}
.mic{display:grid;place-items:center;width:84px;height:84px;margin:6px auto;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink)}
.mic svg{width:36px;height:36px}
.mic.on{background:var(--warn);color:#fff}
@media (prefers-reduced-motion:no-preference){.mic.on{animation:micpulse 1.2s ease-out infinite}@keyframes micpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 55%,transparent)}100%{box-shadow:0 0 0 20px transparent}}}
.mic-state{text-align:center;font-weight:700;color:var(--muted);margin-bottom:12px;min-height:1.4em}
.ics-list{max-height:46vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ics-row{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
.ics-row:last-child{border-bottom:0}
.ics-row input{width:20px;height:20px;flex:none;margin-top:2px}
.ics-row>span{display:flex;flex-direction:column;gap:3px;min-width:0}
.ics-row b{overflow-wrap:anywhere}
.ics-row small{color:var(--muted)}
.alarm{text-align:center;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:10px}
.alarm-ic{width:72px;height:72px;border-radius:50%;background:var(--warn-bg);color:var(--warn);display:grid;place-items:center}
.alarm-ic svg{width:36px;height:36px}
.alarm h3{margin:0;font-size:1.5rem}
.alarm p{margin:0;color:var(--muted);font-weight:700}
@media (prefers-reduced-motion:no-preference){.alarm-ic{animation:ringing 1s ease-in-out infinite}@keyframes ringing{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(4deg)}}}
.vprev{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:4px 14px}
.vprev .detail-row:last-child{border-bottom:0}
.toast{position:fixed;z-index:30;bottom:calc(150px + env(safe-area-inset-bottom,0px));inset-inline:16px;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:var(--shadow)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.welcome h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;margin:0 0 6px}
.welcome p{margin:0 0 14px;color:var(--muted)}
.loading{padding:40px 0;text-align:center;color:var(--muted);font-weight:700}
.tabs2{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs2 button{border:0;background:none;height:36px;padding-inline:14px;border-radius:9px;font-weight:800}
.tabs2 button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.week-btn{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:start}
.week-btn svg{width:24px;height:24px;flex:none;color:var(--accent)}
.week-btn b{display:block;font-size:1rem}
.week-btn span{font-size:.82rem;color:var(--muted)}
.week-nav{display:flex;align-items:center;gap:8px;margin-top:8px}
.week-nav h2{flex:1;min-width:0;margin:0;text-align:center;font-family:var(--f-display);font-weight:400;font-size:1.15rem;font-variant-numeric:tabular-nums}
.strip4{grid-template-columns:repeat(4,1fr);margin-top:12px}
.strip4 .stat{padding:8px 10px}

.wday .free{padding:10px 14px;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

<script>
document.documentElement.lang='he';document.documentElement.dir='rtl';

/* ---------- constants ---------- */
const CATS=['חוג','רופא','אירוע משפחתי','יום הולדת','בית ספר / גן','הסעה','קניות','מסעדה','נותני שירות','תשלומים','בית','עבודה','אישי','זוגי','ספורט','אחר'];
const STORES=['סופר','ירקן','פארם','לבית','אחר'];
const KINDS=['רופא','מנקה','מסעדה','בייביסיטר','גן / בית ספר','חוג','בעל מקצוע','אחר'];
const COLORS=['#E4572E','#F08A24','#E9C03A','#3FA34D','#16A39A','#2F80ED','#5B5FC7','#9B51E0','#E2468A','#8D6346','#0E7490','#64748B','#334155','#7C3A5C'];
const PARENT_COLORS=['#334155','#7C3A5C'];
const DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const DAYS_FULL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const REMINDS=[[0,'ללא התראה'],[10,'10 דקות לפני'],[15,'רבע שעה לפני'],[30,'חצי שעה לפני'],[60,'שעה לפני'],[120,'שעתיים לפני'],[180,'3 שעות לפני'],[1440,'יום לפני'],[2880,'יומיים לפני'],[10080,'שבוע לפני']];
const RECURS=[['none','חד פעמי'],['daily','כל יום'],['weekly','כל שבוע'],['biweekly','כל שבועיים'],['monthly','כל חודש'],['yearly','כל שנה']];
const TEMPLATES=[
  {label:'חוג שבועי',cat:'חוג',recur:'weekly',time:'16:30',dur:60,remind:60},
  {label:'תור לרופא',cat:'רופא',time:'09:00',dur:30,remind:120},
  {label:'יום הולדת',cat:'יום הולדת',recur:'yearly',time:'',remind:1440},
  {label:'להזמין מנקה',cat:'נותני שירות',noDate:true,title:'להזמין מנקה'},
  {label:'מסעדה',cat:'מסעדה',time:'20:00',dur:120,remind:180},
  {label:'הסעה / איסוף',cat:'הסעה',time:'13:00',dur:20,remind:30},
  {label:'תשלום חודשי',cat:'תשלומים',recur:'monthly',time:'',remind:1440},
  {label:'אירוע משפחתי',cat:'אירוע משפחתי',time:'19:00',dur:180,remind:1440},
  {label:'פגישת עבודה',cat:'עבודה',time:'10:00',dur:60,remind:30,parent:true},
  {label:'ערב זוגי',cat:'זוגי',time:'20:30',dur:180,remind:180},
  {label:'ספורט',cat:'ספורט',recur:'weekly',time:'07:00',dur:60,remind:30,parent:true},
  {label:'משימה אישית',cat:'אישי',noDate:true,parent:true}
];

/* ---------- icons ---------- */
const I={
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  sunrise:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 18a5 5 0 0 0-10 0M12 2v7M4.2 10.2l1.4 1.4M1 18h2M21 18h2M18.4 11.6l1.4-1.4M23 22H1M8 6l4-4 4 4"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  tick:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

I.week='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>';

I.mic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8.5 21h7"/></svg>';
I.bell='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>';
/* ---------- state ---------- */
const S={members:[],tasks:[],shopping:[],contacts:[],settings:{}};
const UI={view:lsGet('view')||'today',person:lsGet('person'),calMonth:null,calDay:null,loaded:false,reportDay:0,shopStore:'סופר'};
let personAuto=UI.person===null;let myId=lsGet('me')||'';

/* ---------- utils ---------- */
function lsGet(k){try{return localStorage.getItem('hp.'+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem('hp.'+k,v)}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const fromMin=m=>pad(Math.floor(((m%1440)+1440)%1440/60))+':'+pad(m%60);
const dateLong=s=>new Intl.DateTimeFormat('he-IL',{weekday:'long',day:'numeric',month:'long'}).format(pd(s));
const dateShort=s=>{const d=pd(s);return d.getDate()+'.'+(d.getMonth()+1)};
const monthName=s=>new Intl.DateTimeFormat('he-IL',{month:'long',year:'numeric'}).format(pd(s));
function inkOn(hex){const n=parseInt((hex||'#888888').slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255>0.66?'#1A1A1A':'#FFFFFF'}
function durText(m){if(!m)return'';if(m<60)return m+' דק׳';if(m===60)return'שעה';if(m===120)return'שעתיים';return(m/60).toString().replace(/\.0$/,'')+' ש׳'}
function remindText(m){const f=REMINDS.find(r=>r[0]===m);if(f)return f[1];if(m<60)return m+' דקות לפני';if(m%1440===0)return m/1440+' ימים לפני';return Math.round(m/6)/10+' שעות לפני'}
const member=id=>S.members.find(m=>m.id===id);
const parents=()=>S.members.filter(m=>m.role!=='child').sort((a,b)=>(a.order||0)-(b.order||0));
const kids=()=>S.members.filter(m=>m.role==='child').sort((a,b)=>(a.order||0)-(b.order||0));
const cvars=c=>`--c:${c};--ci:${inkOn(c)}`;
function waLink(phone,text){let p=(phone||'').replace(/\D/g,'');if(p.startsWith('0'))p='972'+p.slice(1);return 'https://wa.me/'+p+(text?'?text='+encodeURIComponent(text):'')}

/* ---------- recurrence ---------- */
function isRecurring(t){return t.recur&&t.recur!=='none'}
function occurs(t,d){
  if(!t.date||d<t.date)return false;
  if(t.until&&d>t.until)return false;
  if(t.skip&&t.skip.includes(d))return false;
  const r=t.recur||'none',D=pd(d),S0=pd(t.date);
  if(r==='none')return d===t.date;
  if(r==='daily')return true;
  if(r==='weekly'||r==='biweekly'){
    const days=(t.days&&t.days.length)?t.days:[S0.getDay()];
    if(!days.includes(D.getDay()))return false;
    if(r==='weekly')return true;
    const w0=new Date(S0);w0.setDate(S0.getDate()-S0.getDay());
    const w1=new Date(D);w1.setDate(D.getDate()-D.getDay());
    return Math.round((w1-w0)/604800000)%2===0;
  }
  if(r==='monthly')return D.getDate()===S0.getDate();
  if(r==='yearly')return D.getDate()===S0.getDate()&&D.getMonth()===S0.getMonth();
  return false;
}
const isDone=(t,d)=>isRecurring(t)?(t.doneDates||[]).includes(d):!!t.done;
function forPerson(t,pid){
  if(!pid)return true;const m=member(pid);if(!m)return true;
  if(m.role==='child')return (t.kids||[]).includes(pid);
  const ps=(t.parents||[]).filter(member);return ps.includes(pid)||!ps.length;
}
const byTime=(a,b)=>(a.time||'00:00').localeCompare(b.time||'00:00')||(a.title||'').localeCompare(b.title||'');
const itemsOn=(d,pid)=>S.tasks.filter(t=>occurs(t,d)&&forPerson(t,pid)).sort(byTime);
const overdue=pid=>S.tasks.filter(t=>!isRecurring(t)&&t.date&&t.date<today()&&!t.done&&forPerson(t,pid)).sort((a,b)=>a.date.localeCompare(b.date));
const undated=pid=>S.tasks.filter(t=>!t.date&&!t.done&&forPerson(t,pid)).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
function conflicts(d){
  const out=new Set();
  parents().forEach(p=>{
    const xs=S.tasks.filter(t=>occurs(t,d)&&t.time&&!isDone(t,d)&&(t.parents||[]).includes(p.id));
    for(let i=0;i<xs.length;i++)for(let j=i+1;j<xs.length;j++){
      const a=xs[i],b=xs[j],as=toMin(a.time),bs=toMin(b.time),ae=as+(+a.dur||30),be=bs+(+b.dur||30);
      if(as<be&&bs<ae){out.add(a.id+'|'+p.id);out.add(b.id+'|'+p.id)}
    }
  });
  return out;
}
const conflictIds=set=>new Set([...set].map(k=>k.split('|')[0]));
function startAt(t,d){const x=pd(d);if(t.time){const[h,m]=t.time.split(':').map(Number);x.setHours(h,m,0,0)}else x.setHours(8,0,0,0);return x}
function dueAlerts(pid){
  const now=new Date(),out=[];
  for(let i=0;i<8;i++){const d=addDays(today(),i);
    itemsOn(d,pid).forEach(t=>{if(!t.remind||isDone(t,d))return;const st=startAt(t,d);if(now>=st-t.remind*60000&&now<st)out.push({t,d,st})});
  }
  return out.sort((a,b)=>a.st-b.st);
}

/* ---------- storage: shared family board in the cloud, or this phone only ---------- */
const COLS=['members','tasks','shopping','contacts'];
S.deleted={};
const CLOUD=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey);
const Local={
  load(into){const T=into||S;try{const o=JSON.parse(lsGet('data')||'null');if(o)COLS.concat('settings','deleted').forEach(k=>{if(o[k])T[k]=o[k]})}catch(e){}return T},
  save(){if(CLOUD){savePrivate();return}try{localStorage.setItem('hp.data',JSON.stringify(S))}catch(e){toast('השמירה בטלפון נכשלה. ייתכן שהזיכרון מלא.')}}
};
let rq=0;function render(){if(rq)return;rq=setTimeout(()=>{rq=0;draw()},0)}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clean(o){const x={...o};delete x.id;return x}
function commit(){Local.save();render();return true}

/* cloud state */
let fdb=null,auth=null,uid=null,fid=lsGet('fam')||'',famUsers=[],famCode='',cloudTasks=[],privTasks=[],unsubs=[],localData=null,askedWho=false;
function loadPrivate(){try{privTasks=JSON.parse(lsGet('private')||'[]')}catch(e){privTasks=[]}}
function savePrivate(){lsSet('private',JSON.stringify(privTasks))}
function joinTasks(){S.tasks=cloudTasks.concat(privTasks)}
const famRef=()=>fdb.collection('families').doc(fid);
const fcol=c=>famRef().collection(c);
// Cloud writes apply on screen at once and reach the server when online, so they are not awaited.
function cw(p){p.catch(e=>{console.warn(e);toast(e&&e.code==='permission-denied'?'אין הרשאה לשמור בלוח הזה. ייתכן שהמכשיר נותק מהמשפחה.':'השמירה נכשלה. בדקו את החיבור לאינטרנט.')});return true}

function put(c,id,data){
  const o={...clean(data),updatedAt:Date.now()};
  if(!CLOUD){const a=S[c],i=a.findIndex(x=>x.id===id);i<0?a.push({...o,id}):a[i]={...o,id};return commit()}
  if(c==='tasks'){
    if(o.private){privTasks=privTasks.filter(x=>x.id!==id).concat({...o,id});savePrivate();if(cloudTasks.some(x=>x.id===id))cw(fcol('tasks').doc(id).delete());joinTasks();render();return true}
    if(privTasks.some(x=>x.id===id)){privTasks=privTasks.filter(x=>x.id!==id);savePrivate();joinTasks()}
  }
  return cw(fcol(c).doc(id).set(o));
}
function patch(c,id,data){
  if(!CLOUD){const o=S[c].find(x=>x.id===id);if(o)Object.assign(o,data,{updatedAt:Date.now()});return commit()}
  if(c==='tasks'){const p=privTasks.find(x=>x.id===id);if(p){Object.assign(p,data,{updatedAt:Date.now()});savePrivate();joinTasks();render();return true}}
  return cw(fcol(c).doc(id).update({...data,updatedAt:Date.now()}));
}
function del(c,id){
  if(!CLOUD){S[c]=S[c].filter(x=>x.id!==id);S.deleted[id]=Date.now();const cut=Date.now()-180*864e5;for(const k in S.deleted)if(S.deleted[k]<cut)delete S.deleted[k];return commit()}
  if(c==='tasks'&&privTasks.some(x=>x.id===id)){privTasks=privTasks.filter(x=>x.id!==id);savePrivate();joinTasks();render();return true}
  return cw(fcol(c).doc(id).delete());
}
function putSettings(data){
  const s={...S.settings,...data,updatedAt:Date.now()};S.settings=s;
  if(!CLOUD)return commit();
  render();return cw(famRef().update({settings:s,name:s.family||''}));
}
function linkMe(id){
  myId=id;lsSet('me',id);
  if(id){UI.person=id;lsSet('person',id);personAuto=false}
  if(CLOUD&&fid&&uid)cw(fcol('users').doc(uid).update({memberId:id}));
}

/* cloud connection */
const FB='https://www.gstatic.com/firebasejs/10.14.1/';
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function connect(){
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(!CLOUD){Local.load();UI.loaded=true;render();return}
  loadPrivate();joinTasks();
  localData=Local.load({members:[],tasks:[],shopping:[],contacts:[],settings:{},deleted:{}});
  try{for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await loadScript(FB+f)}
  catch(e){UI.error='לא הצלחתי לטעון את האפליקציה. בדקו את החיבור לאינטרנט ונסו שוב.';UI.loaded=true;render();return}
  firebase.initializeApp(window.FIREBASE_CONFIG);
  auth=firebase.auth();fdb=firebase.firestore();
  try{await fdb.enablePersistence({synchronizeTabs:true})}catch(e){}
  auth.onAuthStateChanged(async u=>{
    if(!u){try{await auth.signInAnonymously()}catch(e){UI.error='בפתיחה הראשונה צריך חיבור לאינטרנט. התחברו ונסו שוב.';UI.loaded=true;render()}return}
    uid=u.uid;
    if(!fid){try{const ix=await fdb.collection('userIndex').doc(uid).get();if(ix.exists)fid=ix.data().familyId||''}catch(e){}}
    if(fid)openFamily(fid);else{UI.loaded=true;render();setTimeout(handleHash,30)}
  });
}
function openFamily(id){
  unsubs.forEach(f=>f());unsubs=[];fid=id;lsSet('fam',id);UI.loaded=false;
  let pending=COLS.length+2;
  const ready=()=>{if(--pending>0)return;UI.loaded=true;render();setTimeout(()=>{
    if(!member(myId)&&S.members.length&&!askedWho&&!location.hash){askedWho=true;whoSheet()}
    if(location.hash)handleHash();else morningCheck();notifyDue()},60)};

/* ---------- weekly report ---------- */
function weekStartOf(d){const x=pd(d);x.setDate(x.getDate()-x.getDay());return ymd(x)}
function weekData(ws,pid){
  const days=[...Array(7)].map((_,i)=>{const d=addDays(ws,i);return {d,items:itemsOn(d,pid),conf:conflictIds(conflicts(d))}});
  const all=days.flatMap(x=>x.items.map(t=>({t,d:x.d})));
  return {days,all,done:all.filter(o=>isDone(o.t,o.d)).length,
    confN:days.reduce((n,x)=>n+x.items.filter(t=>x.conf.has(t.id)).length,0),
    unassigned:all.filter(o=>!(o.t.parents||[]).filter(member).length)};
}
const weekRange=ws=>`${dateShort(ws)}–${dateShort(addDays(ws,6))}`;
function viewWeek(){

  if(ws!==thisWeek)h+=`<div style="text-align:center;margin-top:6px"><button class="link" style="background:none;border:0;color:var(--accent);font-weight:800" data-act="wk" data-n="0">חזרה לשבוע הנוכחי</button></div>`;
  h+=`<div class="strip strip4"><div class="stat"><b>${W.all.length}</b><span>אירועים</span></div><div class="stat"><b>${W.done}</b><span>בוצעו</span></div><div class="stat"><b>${W.all.length-W.done}</b><span>פתוחות</span></div><div class="stat"><b>${W.confN}</b><span>חפיפות</span></div></div>`;

  h+=`<section class="sec"><div class="sec-h"><h2>יום אחרי יום</h2></div><div class="list">${W.days.map(x=>`<div class="wday${x.d===t0?' is-today':''}"><div class="wday-h"><span>${dateLong(x.d)}</span>${x.d===t0?'<span class="pill soft">היום</span>':''}<span class="count">${x.items.length}</span></div>

  h+=`<div class="actions" style="margin-top:16px"><button class="btn primary" data-act="weekshare">שיתוף הדוח</button><button class="btn" data-act="weekcopy">העתקה</button></div>`;

function weekText(){
  const ws=UI.weekStart||weekStartOf(today()),pid=UI.person,W=weekData(ws,pid),who=pid?member(pid):null;
  const L=[`דוח שבועי${S.settings.family?' - משפחת '+S.settings.family:''}`,`${weekRange(ws)}${who?' · '+who.name:''}`,`${W.all.length} אירועים · ${W.done} בוצעו`];
  W.days.forEach(x=>{L.push('',dateLong(x.d)+':');if(!x.items.length)L.push('יום פנוי');
    x.items.forEach(t=>{const ks=(t.kids||[]).map(member).filter(Boolean).map(k=>k.name),ps=(t.parents||[]).map(member).filter(Boolean).map(p=>p.name);
      L.push(`• ${t.time?t.time+' ':''}${t.title}${ks.length?' ('+ks.join(', ')+')':''}${ps.length?' · '+ps.join(', '):''}${isDone(t,x.d)?' ✓':''}`)})});
  return L.join('\n');
}

  if(/^שעה\s+וחצי$/.test(str))return 90;
  if(/^שעתיים(\s+וחצי)?$/.test(str))return /וחצי/.test(str)?150:120;
  if(/^שעה$/.test(str))return 60;

  if(/^(יום|יממה)$/.test(str))return 1440;

function recurText(t){

function gcalUrl(t,d){
  const p=new URLSearchParams({action:'TEMPLATE',text:t.title,ctz:'Asia/Jerusalem'});
  const base=(d||t.date).replace(/-/g,'');
  if(t.time){const s=toMin(t.time),e=s+(+t.dur||60);const end=e>=1440?addDays(d||t.date,1).replace(/-/g,''):base;
    p.set('dates',`${base}T${t.time.replace(':','')}00/${end}T${fromMin(e).replace(':','')}00`)}
  else p.set('dates',`${base}/${addDays(d||t.date,1).replace(/-/g,'')}`);
  const ks=(t.kids||[]).map(member).filter(Boolean).map(k=>k.name);
  p.set('details',[ks.length?'ילדים: '+ks.join(', '):'',t.notes||'',t.remind?'תזכורת: '+remindText(+t.remind):''].filter(Boolean).join('\n'));
  if(t.location)p.set('location',t.location);
  const rr={daily:'DAILY',weekly:'WEEKLY',biweekly:'WEEKLY;INTERVAL=2',monthly:'MONTHLY',yearly:'YEARLY'}[t.recur];
  if(rr){let r='RRULE:FREQ='+rr;if((t.recur==='weekly'||t.recur==='biweekly')&&t.days&&t.days.length)r+=';BYDAY='+t.days.map(i=>['SU','MO','TU','WE','TH','FR','SA'][i]).join(',');if(t.until)r+=';UNTIL='+t.until.replace(/-/g,'')+'T235959Z';p.set('recur',r)}
  const emails=(t.parents||[]).map(member).filter(m=>m&&m.email).map(m=>m.email);
  if(emails.length)p.set('add',emails.join(','));
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}

/* ---------- morning report ---------- */
function reportText(pid,d){
  const m=member(pid);if(!m)return'';
  const isKid=m.role==='child',items=itemsOn(d,pid),line=t=>{
    const ks=(t.kids||[]).map(member).filter(Boolean).map(k=>k.name);
    return `• ${t.time?t.time+' ':''}${t.title}${!isKid&&ks.length?' ('+ks.join(', ')+')':''}${t.location?' · '+t.location:''}${isDone(t,d)?' ✓':''}`};
  const L=[`בוקר טוב ${m.name}!`,`${d===today()?'היום':'מחר'}, ${dateLong(d)}`,''];
  if(items.length){L.push(`מה יש ${d===today()?'היום':'מחר'} (${items.length}):`);items.forEach(t=>L.push(line(t)))}
  else L.push('אין משימות מתוכננות. יום רגוע!');
  const cids=conflictIds(conflicts(d));const cf=items.filter(t=>cids.has(t.id)&&(t.parents||[]).includes(pid));
  if(cf.length)L.push('',`שימו לב: חפיפה בין ${cf.map(t=>t.title).join(' ו־')}.`);
  if(!isKid){
    const od=overdue(pid);if(od.length){L.push('','נשארו פתוחות מהימים הקודמים:');od.slice(0,8).forEach(t=>L.push(`• ${t.title} (${dateShort(t.date)})`))}
    const ud=undated(pid);if(ud.length){L.push('','לביצוע כשיש זמן:');ud.slice(0,8).forEach(t=>L.push('• '+t.title))}
    const sh=S.shopping.filter(s=>!s.done);if(sh.length)L.push('',`ברשימת הקניות: ${sh.slice(0,10).map(s=>s.name).join(', ')}${sh.length>10?' ועוד '+(sh.length-10):''}`);
  }
  const nx=itemsOn(addDays(d,1),pid).filter(t=>t.time&&t.time<'10:00');
  if(nx.length){L.push('','מחר מוקדם בבוקר:');nx.forEach(t=>L.push(line(t)))}
  return L.join('\n');
}

  if(e.target.id==='shopForm'){e.preventDefault();const i=document.getElementById('shopInput'),st=document.getElementById('shopStore').value;UI.shopStore=st;
    const names=i.value.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);if(!names.length)return;i.value='';
    for(const n of names)await put('shopping',newId('shopping'),{name:n,store:st,done:false,createdAt:Date.now()});
    document.getElementById('shopInput')?.focus()}
  if(e.target.id==='joinForm'||e.target.id==='joinForm2'){e.preventDefault();const i=e.target.querySelector('input');const b=e.target.querySelector('button');b.disabled=true;await joinFamily(i.value);b.disabled=false}
  if(e.target.id==='welcomeForm'){e.preventDefault();
    const fam=document.getElementById('wFam').value.trim();
    const ps=['wP1','wP2'].map(i=>document.getElementById(i).value.trim()).filter(Boolean);
    const ks=[...document.querySelectorAll('.wkid')].map(i=>i.value.trim()).filter(Boolean);
    if(!ps.length&&!ks.length){toast('הוסיפו לפחות שם אחד');return}
    let o=1;const now=Date.now();
    const ms=ps.map((n,i)=>({id:newId(),name:n,role:'parent',color:PARENT_COLORS[i],phone:'',email:'',order:o++,updatedAt:now}))
      .concat(ks.map((n,i)=>({id:newId(),name:n,role:'child',color:COLORS[i%COLORS.length],phone:'',email:'',order:o++,updatedAt:now})));
    if(CLOUD){
      const b=document.getElementById('wSubmit');b.disabled=true;b.textContent='יוצרים את הלוח…';
      try{await createFamily(fam,{members:ms,settings:{remind:60}});toast('הלוח מוכן! מההגדרות אפשר להזמין את בני המשפחה.')}
      catch(x){console.warn(x);b.disabled=false;b.textContent='יוצאים לדרך';toast('לא הצלחתי ליצור את הלוח. בדקו את החיבור לאינטרנט ונסו שוב.')}
      return}
    await putSettings({family:fam,remind:60});
    ms.forEach(m=>put('members',m.id,m));
    toast('הלוח מוכן! עכשיו אפשר להוסיף חוגים, תורים ואירועים.')}
});
document.addEventListener('change',e=>{if(e.target.id==='sBeep'){lsSet('beep',e.target.value);toast('צליל ההתראה נשמר');return}if(e.target.id==='icsFile'&&e.target.files[0]){readCalendarFile(e.target.files[0]);return}
  if(e.target.id!=='restoreFile'||!e.target.files[0])return;
  const fr=new FileReader();
  fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.tasks))throw 0;pendingImport=o;closeSheet();importCodeObj(o)}catch(x){toast('הקובץ לא נראה כמו גיבוי של לוח המשפחה.')}};
  fr.readAsText(e.target.files[0]);
});
function importCodeObj(o){pendingImport=o;openSheet(`<h3>שחזור מגיבוי</h3><p>${(o.tasks||[]).length} משימות, ${(o.members||[]).length} בני משפחה.</p><p class="hint">השחזור מוסיף ומעדכן. בכל פריט נשמרת הגרסה החדשה יותר.</p><div class="actions" style="margin-top:12px"><button class="btn primary" data-act="doimport">שחזור</button><button class="btn" data-act="closesheet">ביטול</button></div>`)}
function handleHash(){
  const h=location.hash;if(!h||h==='#')return;
  history.replaceState(null,'',APP_URL);
  let m;
  if((m=h.match(/^#join=([A-Za-z0-9]+)/))){if(CLOUD)joinSheet(m[1].toUpperCase());return}
  if((m=h.match(/^#(?:add|sync)=([0-9A-Za-z_-]+)/)))importCode(m[1]);
  else if((m=h.match(/^#report(?:=([\w-]+))?/))&&S.members.length){UI.reportDay=0;reportSheet(m[1]&&member(m[1])?m[1]:'')}
  else if(h==='#new'&&S.members.length)taskSheet();
}
function tick(){if(!document.getElementById('sheetRoot').innerHTML)render();notifyDue();morningCheck()}
window.addEventListener('hashchange',handleHash);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')tick()});
setInterval(tick,60000);
setInterval(()=>{if(UI.loaded)notifyDue()},20000);
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
connect();
if(!CLOUD)setTimeout(()=>{if(location.hash)handleHash();else morningCheck();notifyDue()},80);
</script>
</body>
</html>
